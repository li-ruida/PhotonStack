name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  macos-build-test:
    name: macOS build and test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew bundle

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug

