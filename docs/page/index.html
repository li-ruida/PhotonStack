<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="PhotonStack 是开源的 macOS 深空摄影叠加工作台。通过 M31 一键成片与双天区拼接两个实拍示例，了解从 FITS 原片到成片的流程。">
  <title>PhotonStack · 深空摄影工作台</title>
  <link rel="icon" href="assets/app-icon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <script src="gallery.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳至正文</a>
  <header>
    <nav aria-label="主导航">
      <a href="https://github.com/li-ruida/PhotonStack/blob/master/docs/README.md">文档</a>
      <a href="https://github.com/li-ruida/PhotonStack">GitHub <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="main">
    <section class="hero" aria-labelledby="title">
      <div class="intro">
        <h1 id="title" lang="en">PhotonStack</h1>
        <p>macOS 深空摄影叠加工作台</p>
        <a class="cta" href="https://github.com/li-ruida/PhotonStack/releases/latest" lang="en" aria-label="Download PhotonStack for macOS">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
            <path d="M17.05 12.54c.03 3.63 3.18 4.84 3.21 4.85-.03.09-.5 1.72-1.66 3.4-1 1.45-2.04 2.89-3.68 2.92-1.62.04-2.14-.94-4-.94-1.85 0-2.43.91-3.96.98-1.58.06-2.79-1.57-3.79-3.02-2.06-2.97-3.63-8.4-1.52-12.07a5.92 5.92 0 0 1 5.02-3.05c1.57-.03 3.05 1.04 4.01 1.04.96 0 2.76-1.28 4.65-1.09.79.03 3 .32 4.42 2.39-.12.07-2.64 1.54-2.61 4.59zM14.99 3.61C15.82 2.61 16.38 1.22 16.22 0c-1.19.05-2.62.79-3.47 1.78-.76.87-1.42 2.27-1.24 3.61 1.32.1 2.66-.67 3.48-1.78z"/>
          </svg>
          Download
        </a>
      </div>
      <figure class="plate" data-example="m31">
        <a href="assets/m31.jpg" aria-label="查看仙女座星系完整彩色成片">
          <img width="1120" height="574" src="assets/m31-detail.webp" alt="黑白局部：仙女座星系明亮的核心与两侧的暗尘埃带。" fetchpriority="high">
        </a>
        <figcaption><span>M31 · 仙女座星系</span><span>182 帧叠加</span></figcaption>
      </figure>
      <figure class="plate" data-example="mosaic">
        <a href="assets/mosaic/final.jpg" aria-label="查看两个天区的完整彩色拼接成片">
          <img width="1120" height="574" src="assets/mosaic/detail.webp" alt="拼接成片的黑白局部，丝状星云穿过密集的星点。" loading="lazy">
        </a>
        <figcaption><span>T1 + T2 · 天区拼接</span><span>2 个天区 · 202 帧</span></figcaption>
      </figure>
    </section>
    <section id="process" aria-labelledby="process-title">
      <div class="process-head">
        <div>
          <div class="example-heading">
            <h2 id="process-title">处理过程</h2>
            <fieldset class="examples" aria-label="选择示例工作流">
              <label><input type="radio" name="workflow" value="m31" checked><span>一键成片</span></label>
              <label><input type="radio" name="workflow" value="mosaic" id="example-mosaic"><span>天区拼接</span></label>
            </fieldset>
          </div>
          <p data-example="m31">从 200 张 FITS 亮场，到一张仙女座星系成片。</p>
          <p data-example="mosaic">T1 的 90 帧与 T2 的 112 帧分别堆栈，再用共同星点拼接。</p>
        </div>
        <ol class="steps" data-example="m31" aria-label="选择处理步骤">
          <li><a href="assets/01-import-200.webp" aria-current="step" data-caption="导入 200 张 FITS 亮场，逐张预览原片。">导入</a></li>
          <li><a href="assets/02-analysis-review.webp" data-caption="按星点形状筛选，逐帧复核自动排除的 18 张原片。">筛选</a></li>
          <li><a href="assets/03-stacked-result.webp" data-caption="对齐余下的 182 帧，以 Winsorized 模式抑制异常值。">叠加</a></li>
          <li><a href="assets/04-color-adjustment.webp" data-caption="以 0.35 强度中和色偏，同时保留星系亮度。">调色</a></li>
          <li><a href="assets/05-export-success.webp" data-caption="导出 1928 × 3638 像素的 TIFF，并保存处理记录。">导出</a></li>
        </ol>
        <ol class="steps" data-example="mosaic" aria-label="选择拼接步骤">
          <li><a href="assets/mosaic/01-panels.webp" aria-current="step" data-caption="按天区导入原片。T1_sub 有 90 帧，T2_sub 有 112 帧。">导入</a></li>
          <li><a href="assets/mosaic/02-align.webp" data-caption="分别堆栈两组原片，在配准预览中检查重叠区域的共同星点。">配准</a></li>
          <li><a href="assets/mosaic/03-stitch.webp" data-caption="复用两张母片，以 223 个星点匹配完成对齐，再羽化融合重叠区域。">拼接</a></li>
          <li><a href="assets/mosaic/04-finish.webp" data-caption="在整张拼接成片上将曝光提高 0.35 EV，提亮暗弱的星云。">后期</a></li>
          <li><a href="assets/mosaic/05-export.webp" data-caption="导出 3913 × 3905 像素的 TIFF，保留两个天区的完整画幅。">导出</a></li>
        </ol>
      </div>
      <figure class="workspace" data-example="m31">
        <a href="assets/01-import-200.webp" aria-label="放大查看当前步骤截图">
          <img width="1600" height="1000" src="assets/01-import-200.webp" alt="PhotonStack 导入界面，左侧列出原片，中央显示单帧预览。" loading="lazy">
        </a>
        <figcaption aria-live="polite">导入 200 张 FITS 亮场，逐张预览原片。</figcaption>
      </figure>
      <figure class="workspace" data-example="mosaic">
        <a href="assets/mosaic/01-panels.webp" aria-label="放大查看当前步骤截图">
          <img width="1600" height="1004" src="assets/mosaic/01-panels.webp" alt="两个天区文件夹分别列出 90 帧和 112 帧，中央显示单帧预览。" loading="lazy">
        </a>
        <figcaption aria-live="polite">按天区导入原片。T1_sub 有 90 帧，T2_sub 有 112 帧。</figcaption>
      </figure>
    </section>
  </main>
  <footer aria-label="项目资源">
    <a href="https://github.com/li-ruida/PhotonStack/blob/master/docs/build.md">构建指南</a>
    <a href="https://github.com/li-ruida/PhotonStack/blob/master/docs/cli.md">命令行文档</a>
    <a href="https://github.com/li-ruida/PhotonStack/blob/master/LICENSE">Apache 2.0</a>
  </footer>
</body>
</html>
